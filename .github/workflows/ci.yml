# ==============================================================================
# AIRA Revenue Recovery OS — GitHub Actions CI Pipeline
# Requirement #37: Full deterministic offline CI + optional live Gemini gate
# ==============================================================================
#
# Architecture:
#   Node 20 + Python 3.11 monorepo (separate frontend / backend)
#   Frontend: Vite + React + TypeScript (npm, oxlint, tsc -b)
#   Backend:  FastAPI + SQLAlchemy + SQLite (pytest, uvicorn, aiosqlite)
#   AI:       Gemini via clean provider abstraction (mock in normal CI)
#
# Normal CI (job: ci)
#   Never requires GEMINI_API_KEY. Uses AI_PROVIDER=mock throughout.
#   Runs on every push and pull_request.
#
# Optional Live Gemini Tests (job: live-gemini-tests)
#   Requires the GEMINI_API_KEY GitHub repository secret.
#   Skipped automatically on PRs from forks (secrets unavailable).
#   Only runs after the main CI job succeeds.
# ==============================================================================

name: AIRA CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Main CI Job — fully deterministic, no external services, no API keys
# ---------------------------------------------------------------------------
jobs:
  ci:
    name: CI — Lint · Typecheck · Tests · Datasets · Backend · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Enforce mock AI provider for all steps; GEMINI_API_KEY explicitly empty
      AI_PROVIDER: mock
      GEMINI_API_KEY: ""
      ENVIRONMENT: testing
      DATABASE_URL: "sqlite+aiosqlite:///./recovery_os.db"
      VITE_API_BASE_URL: "http://localhost:8000"

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Runtime setup ─────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # ── Dependency installation ───────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Lint ─────────────────────────────────────────────────────────────
      - name: Lint — frontend (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Lint — backend Python syntax check (compileall)
        run: python -m compileall -q backend/app backend/tests backend/scripts

      # ── Type checking ─────────────────────────────────────────────────────
      - name: Typecheck — frontend TypeScript (tsc -b)
        working-directory: frontend
        run: npm run typecheck

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Test — backend (pytest, AI_PROVIDER=mock, no Gemini key)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -v

      - name: Test — frontend flow and state verification (tsx verify_flows.ts)
        working-directory: frontend
        run: npm test

      # ── Dataset validation ────────────────────────────────────────────────
      - name: Validate datasets — backend SQLite schema and integrity
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python scripts/validate_datasets.py

      - name: Validate datasets — frontend in-memory seed data (TypeScript)
        working-directory: frontend
        run: npm run validate:dataset

      # ── Backend smoke verification ────────────────────────────────────────
      - name: Verify backend — startup and endpoint smoke test
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python scripts/verify_backend.py

      # ── Frontend production build ─────────────────────────────────────────
      - name: Build — frontend production bundle (tsc -b and vite build)
        working-directory: frontend
        run: npm run build

# ---------------------------------------------------------------------------
# Optional Live Gemini Job — only runs when GEMINI_API_KEY secret is present
# ---------------------------------------------------------------------------
  live-gemini-tests:
    name: Optional — Live Gemini Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci]
    if: >-
      github.event_name != 'pull_request' &&
      secrets.GEMINI_API_KEY != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live Gemini integration tests
        working-directory: backend
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENVIRONMENT: testing
          PYTHONPATH: .
        run: pytest -v -m live_gemini
