name: AIRA CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Normal CI Verification (Deterministic / Offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python Runtime (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Stage 1: Dependency Installation
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Stage 2: Linting
      - name: Frontend Code Quality & Lint Check (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Backend Syntax & Bytecode Compilation Check
        run: python -m compileall backend/app backend/tests backend/scripts

      # Stage 3: Type Checking
      - name: Frontend TypeScript Type Checking (tsc)
        working-directory: frontend
        run: npm run typecheck

      # Stage 4: Unit, Integration & Gemini Contract Tests
      - name: Backend Contract & Unit Tests (Offline / Mock AI)
        working-directory: backend
        env:
          AI_PROVIDER: mock
          GEMINI_API_KEY: ""
          ENVIRONMENT: testing
          PYTHONPATH: .
        run: pytest -v

      - name: Frontend State Machine & Flow Verification Tests
        working-directory: frontend
        run: npm test

      # Stage 5: Dataset Validation
      - name: Backend SQLite Dataset Integrity & Schema Validation
        working-directory: backend
        run: python scripts/validate_datasets.py

      - name: Frontend In-Memory Seed Dataset Integrity Validation
        working-directory: frontend
        run: npm run validate:dataset

      # Stage 6: Backend Lifecycle & Endpoint Smoke Verification
      - name: Backend Startup & Endpoint Verification Smoke Test
        working-directory: backend
        env:
          AI_PROVIDER: mock
          GEMINI_API_KEY: ""
          ENVIRONMENT: testing
          PYTHONPATH: .
        run: python scripts/verify_backend.py

      # Stage 7: Production Frontend Build
      - name: Frontend Production Bundle Build (Vite)
        working-directory: frontend
        run: npm run build

  live-gemini-tests:
    name: Optional Live Gemini Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Strictly gated behind the presence of the GEMINI_API_KEY repository secret
    if: ${{ secrets.GEMINI_API_KEY != '' }}
    needs: [ci]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Gemini Contract & Classifier Suite
        working-directory: backend
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENVIRONMENT: testing
          PYTHONPATH: .
        run: pytest -v -m live_gemini
